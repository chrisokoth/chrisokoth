name: Profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/generate_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_USER: ${{ github.repository_owner }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          ORG_NAME: ${{ vars.ORG_NAME || secrets.ORG_NAME }}
          ORG_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: python .github/scripts/generate_stats.py "$RUNNER_TEMP/cards"

      - name: Publish to stats branch
        run: |
          git switch --orphan stats
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add *.svg
          git -c user.name=chrisokoth -c user.email=chrisokoth17@gmail.com \
            commit -q -m "Update profile stats"
          git push -f origin stats
